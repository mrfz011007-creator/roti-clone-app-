# Phase 1: verify the inherited Android project and publish a test APK artifact.
# This is a modified TwinnDroid fork; see LICENSE and ADDITIONAL-TERMS.md.
name: Roti Clone - Android CI

on:
  push:
    branches: [main, "fariz/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roti-clone-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug
        continue-on-error: true

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: roti-clone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
